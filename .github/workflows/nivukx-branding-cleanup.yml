name: Nivukx branding cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(branding): normalize Nivukx public branding') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.gradle', '.idea', '.kotlin', '.cxx', 'build', 'captures', 'audit-report'}
          extensions = {
              '.md', '.txt', '.kt', '.kts', '.java', '.xml', '.gradle', '.toml',
              '.json', '.properties', '.pro', '.py', '.yml', '.yaml', '.sh'
          }

          replacements = [
              ('https://github.com/EchoMusicApp/Echo-Music', 'https://github.com/nivash01/Echo'),
              ('https://github.com/iad1tya/Echo-Music.git', 'https://github.com/nivash01/Echo.git'),
              ('https://github.com/YOUR_USERNAME/Echo-Music.git', 'https://github.com/YOUR_USERNAME/Echo.git'),
              ('cd Echo-Music', 'cd Echo'),
              ('Echo-Music-Universal-GMS-APK', 'Nivukx-Universal-GMS-APK'),
              ('Echo-Music-', 'Nivukx-'),
              ('EchoMusic (2026)', 'Nivukx (2026)'),
              ('Echo Music', 'Nivukx'),
              ('Echo Find', 'Nivukx Find'),
              ('Echo Brain', 'Nivukx Brain'),
              ('echomusic Crash Report', 'Nivukx Crash Report'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Remove cleanup workflow
        run: rm -f .github/workflows/nivukx-branding-cleanup.yml

      - name: Commit normalized branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git commit -m "chore(branding): normalize Nivukx public branding"
          git push origin HEAD:main
