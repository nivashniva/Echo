name: Finalize Nivukx branding

on:
  push:
    branches:
      - rename/nivukx

permissions:
  contents: write

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              "Echo Music": "Nivukx",
              "Echo Find": "Nivukx Find",
              "Echo Brain": "Nivukx Brain",
              "Echo Motion": "Nivukx Motion",
              "EchoMusic (2026)": "Nivukx (2026)",
              "echomusic Crash Report": "Nivukx Crash Report",
          }
          binary_suffixes = {
              ".png", ".jpg", ".jpeg", ".webp", ".gif", ".mp3", ".wav", ".mp4",
              ".m4a", ".flac", ".ogg", ".zip", ".jar", ".aar", ".keystore", ".jks",
              ".apk", ".aab", ".pdf", ".ico", ".ttf", ".otf", ".woff", ".woff2",
          }

          files = subprocess.check_output(["git", "ls-files", "-z"])
          changed = []
          for raw in files.split(b"\0"):
              if not raw:
                  continue
              name = raw.decode("utf-8")
              path = Path(name)
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(name)

          print(f"Branding files changed: {len(changed)}")
          for name in changed:
              print(name)
          PY

      - name: Commit branding normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No remaining public branding changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(branding): normalize remaining Echo references to Nivukx"
          git push
