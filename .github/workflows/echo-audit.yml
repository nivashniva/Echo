name: Nivukx Repository Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Python audit + build simulation
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(branding): normalize Nivukx public branding') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize Nivukx public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.gradle', '.idea', '.kotlin', '.cxx', 'build', 'captures', 'audit-report'}
          extensions = {
              '.md', '.txt', '.kt', '.kts', '.java', '.xml', '.gradle', '.toml',
              '.json', '.properties', '.pro', '.py', '.yml', '.yaml', '.sh'
          }

          replacements = [
              ('https://github.com/EchoMusicApp/Echo-Music', 'https://github.com/nivash01/Echo'),
              ('https://github.com/iad1tya/Echo-Music.git', 'https://github.com/nivash01/Echo.git'),
              ('https://github.com/YOUR_USERNAME/Echo-Music.git', 'https://github.com/YOUR_USERNAME/Echo.git'),
              ('cd Echo-Music', 'cd Echo'),
              ('Echo-Music-Universal-GMS-APK', 'Nivukx-Universal-GMS-APK'),
              ('Echo-Music-', 'Nivukx-'),
              ('EchoMusic (2026)', 'Nivukx (2026)'),
              ('Echo Music', 'Nivukx'),
              ('Echo Find', 'Nivukx Find'),
              ('Echo Brain', 'Nivukx Brain'),
              ('echomusic Crash Report', 'Nivukx Crash Report'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Commit normalized branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git commit -m "chore(branding): normalize Nivukx public branding"
          git push origin HEAD:main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Provision Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -validity 10000
          fi

      - name: Run Python repository audit
        run: python3 scripts/echo_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-Python-Audit-Report
          path: audit-report/
          if-no-files-found: error
          retention-days: 14
