name: Nivukx Static CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  static-audit:
    name: Static repository audit (no app build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Nivukx static audit
        run: python3 scripts/nivukx_audit.py
      - name: Upload static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-Static-Audit-Report
          path: audit-report/
          if-no-files-found: error
          retention-days: 14
