name: Android CI

on:
  push:
    branches: [ "main", "rename/nivukx" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  branding-normalization:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/rename/nivukx') ||
      (github.event_name == 'pull_request' && github.head_ref == 'rename/nivukx')
    name: Normalize Nivukx public branding
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Normalize public branding
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import subprocess

        replacements = {
            "Echo Music": "Nivukx",
            "Echo Find": "Nivukx Find",
            "Echo Brain": "Nivukx Brain",
            "Echo Motion": "Nivukx Motion",
            "EchoMusic (2026)": "Nivukx (2026)",
            "echomusic Crash Report": "Nivukx Crash Report",
        }
        binary_suffixes = {
            ".png", ".jpg", ".jpeg", ".webp", ".gif", ".mp3", ".wav", ".mp4",
            ".m4a", ".flac", ".ogg", ".zip", ".jar", ".aar", ".keystore", ".jks",
            ".apk", ".aab", ".pdf", ".ico", ".ttf", ".otf", ".woff", ".woff2",
        }

        files = subprocess.check_output(["git", "ls-files", "-z"])
        changed = []
        for raw in files.split(b"\0"):
            if not raw:
                continue
            name = raw.decode("utf-8")
            path = Path(name)
            if path.suffix.lower() in binary_suffixes:
                continue
            try:
                text = path.read_text(encoding="utf-8")
            except (UnicodeDecodeError, OSError):
                continue
            updated = text
            for old, new in replacements.items():
                updated = updated.replace(old, new)
            if updated != text:
                path.write_text(updated, encoding="utf-8")
                changed.append(name)

        print(f"Branding files changed: {len(changed)}")
        for name in changed:
            print(name)
        PY

    - name: Commit and push branding changes
      shell: bash
      run: |
        if git diff --quiet; then
          echo "No remaining public branding changes found."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "refactor(branding): normalize remaining Echo references to Nivukx"
        git push origin HEAD:${{ github.head_ref || github.ref_name }}

  build:
    name: Build Universal GMS APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Gradle
      run: chmod +x gradlew

    - name: Compile Universal GMS Kotlin
      run: ./gradlew :app:compileUniversalGmsDebugKotlin --stacktrace --no-daemon

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Universal GMS Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: ./gradlew assembleUniversalGmsRelease --stacktrace --no-daemon

    - name: Build Universal GMS Debug APK
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000
        ./gradlew assembleUniversalGmsDebug --stacktrace --no-daemon

    - name: Upload Universal APK
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Universal-GMS-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
