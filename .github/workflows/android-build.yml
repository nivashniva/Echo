name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build Universal GMS APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Prepare Gradle
      run: chmod +x gradlew

    - name: Compile Universal GMS Kotlin
      run: ./gradlew :app:compileUniversalGmsDebugKotlin --stacktrace --no-daemon

    - name: Decode Keystore
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

    - name: Build Universal GMS Release APK
      if: ${{ env.KEYSTORE_BASE64 != '' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: ./gradlew assembleUniversalGmsRelease --stacktrace --no-daemon

    - name: Build Universal GMS Debug APK
      if: ${{ env.KEYSTORE_BASE64 == '' }}
      run: |
        mkdir -p "$HOME/.android"
        keytool -genkeypair \
          -keystore "$HOME/.android/debug.keystore" \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA \
          -validity 10000
        ./gradlew assembleUniversalGmsDebug --stacktrace --no-daemon

    - name: Upload Universal APK
      uses: actions/upload-artifact@v4
      with:
        name: Echo-Music-Universal-GMS-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
