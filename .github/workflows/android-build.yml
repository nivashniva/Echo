name: Nivukx Static CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  static-audit:
    name: Static repository audit (no app build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Nivukx static audit
        run: python3 scripts/nivukx_audit.py
      - name: Upload static audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-Static-Audit-Report
          path: audit-report/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Universal GMS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Show Java version
        run: java -version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair             -v             -keystore "$HOME/.android/debug.keystore"             -alias androiddebugkey             -keyalg RSA             -keysize 2048             -validity 10000             -storepass android             -keypass android             -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug keystore
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list             -keystore "$HOME/.android/debug.keystore"             -storepass android             -alias androiddebugkey

      - name: Compile Universal GMS Kotlin
        run: ./gradlew :app:compileUniversalGmsDebugKotlin --stacktrace --no-daemon

      - name: Build Universal GMS Debug APK
        run: ./gradlew :app:assembleUniversalGmsDebug --stacktrace --no-daemon

      - name: Find generated APK
        if: success()
        run: |
          echo "Generated APK files:"
          find . -type f -path "*/build/outputs/apk/*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-universal-gms-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14
