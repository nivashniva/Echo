name: Nivukx branding normalization

on:
  push:
    branches:
      - rename/nivukx

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Nivukx branding
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          replacements = {
              'Echo Music': 'Nivukx',
              'EchoMusic': 'Nivukx',
              'Echo Find': 'Nivukx Find',
              'Echo Brain': 'Nivukx Brain',
              'Echo Motion': 'Nivukx Motion',
              'echomusic Crash Report': 'Nivukx Crash Report',
          }
          skip_dirs = {'.git', '.gradle', 'build', '.idea'}
          skip_suffixes = {'.png', '.jpg', '.jpeg', '.webp', '.gif', '.mp3', '.wav', '.mp4', '.zip', '.jar', '.aar'}

          changed = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized {len(changed)} files')
          for path in changed:
              print(path)

      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git commit -m "refactor(branding): complete Nivukx name normalization"
          git push origin HEAD:rename/nivukx

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/nivukx-branding-normalize.yml
          git add -A
          git commit -m "chore(branding): remove temporary normalization workflow"
          git push origin HEAD:rename/nivukx
