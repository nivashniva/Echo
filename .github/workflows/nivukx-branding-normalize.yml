name: Nivukx branding normalization

on:
  push:
    branches:
      - rename/nivukx

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize exact public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.gradle', 'build', '.idea'}
          skip_files = {Path('.github/workflows/nivukx-branding-normalize.yml')}
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.mp3', '.wav',
              '.mp4', '.zip', '.jar', '.aar', '.keystore', '.jks'
          }
          replacements = {
              'Echo Music': 'Nivukx',
              'Echo Find': 'Nivukx Find',
              'Echo Brain': 'Nivukx Brain',
              'Echo Motion': 'Nivukx Motion',
              'EchoMusic (2026)': 'Nivukx (2026)',
              'echomusic Crash Report': 'Nivukx Crash Report',
          }

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path in skip_files:
                  continue
              if path.suffix.lower() in binary_suffixes:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized {len(changed)} files.')
          for path in changed:
              print(path)
          PY

      - name: Verify public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.gradle', 'build', '.idea'}
          skip_files = {Path('.github/workflows/nivukx-branding-normalize.yml')}
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.mp3', '.wav',
              '.mp4', '.zip', '.jar', '.aar', '.keystore', '.jks'
          }
          banned = (
              'Echo Music',
              'Echo Find',
              'Echo Brain',
              'Echo Motion',
              'EchoMusic (2026)',
              'echomusic Crash Report',
          )
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or path in skip_files:
                  continue
              if path.suffix.lower() in binary_suffixes or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for value in banned:
                  if value in text:
                      failures.append(f'{path}: {value}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Nivukx public-brand verification passed.')
          PY

      - name: Package changed files
        shell: bash
        run: |
          git diff --name-only > /tmp/nivukx_changed_files.txt
          git diff --numstat > /tmp/nivukx_numstat.txt
          if [ ! -s /tmp/nivukx_changed_files.txt ]; then
            echo "No changed files found."
            exit 0
          fi
          mkdir -p /tmp/nivukx_bundle
          while IFS= read -r path; do
            mkdir -p "/tmp/nivukx_bundle/$(dirname "$path")"
            cp -- "$path" "/tmp/nivukx_bundle/$path"
          done < /tmp/nivukx_changed_files.txt
          cp /tmp/nivukx_changed_files.txt /tmp/nivukx_bundle/CHANGED_FILES.txt
          cp /tmp/nivukx_numstat.txt /tmp/nivukx_bundle/NUMSTAT.txt
          cd /tmp/nivukx_bundle
          zip -qr /tmp/Nivukx-branding-normalized.zip .

      - name: Upload normalized files
        if: ${{ hashFiles('/tmp/Nivukx-branding-normalized.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-branding-normalized
          path: /tmp/Nivukx-branding-normalized.zip
          if-no-files-found: error
