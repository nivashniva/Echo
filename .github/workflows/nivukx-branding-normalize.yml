name: Nivukx Branding Normalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize Nivukx branding
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          text_exts = {
              '.md', '.txt', '.kt', '.kts', '.java', '.xml', '.json', '.yml', '.yaml',
              '.properties', '.gradle', '.py', '.sh', '.toml', '.html', '.js', '.ts', '.tsx',
          }

          replacements = [
              ('Echo Music', 'Nivukx'),
              ('Echo Brain', 'Nivukx Brain'),
              ('Echo Find', 'Nivukx Find'),
              ('EchoMusic', 'Nivukx'),
              ('Echo-Music', 'Nivukx'),
              ('EchoMusicApp/Echo-Music', 'nivash01/Echo'),
              ('iad1tya/Echo-Music', 'nivash01/Echo'),
              ('ECHO_BRAIN_DOCS.md', 'NIVUKX_BRAIN_DOCS.md'),
          ]

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in tracked:
              if not name:
                  continue
              path = Path(name)
              if path.suffix.lower() not in text_exts or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              # Preserve package/application identity and internal namespace.
              if path.suffix.lower() in {'.kt', '.kts', '.java', '.gradle'}:
                  lines = []
                  for line in text.splitlines(keepends=True):
                      if ('package echo.music.iad1tya' in line or
                          'import echo.music.iad1tya' in line or
                          'com.music.echo' in line):
                          # Restore namespace/package fragments only if a broad replacement touched them.
                          line = line.replace('com.music.nivukx', 'com.music.echo')
                          line = line.replace('nivukx.music.iad1tya', 'echo.music.iad1tya')
                      lines.append(line)
                  text = ''.join(lines)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Keep the README/setup links and functional upstream raw URL on the current repository.
          p = Path('README.md')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('https://github.com/EchoMusicApp/Echo-Music/releases/latest',
                            'https://github.com/nivash01/Echo/releases/latest')
              t = t.replace('https://github.com/iad1tya/Echo-Music.git',
                            'https://github.com/nivash01/Echo.git')
              t = t.replace('cd Echo-Music', 'cd Echo')
              p.write_text(t, encoding='utf-8')

          p = Path('SETUP.md')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('https://github.com/iad1tya/Echo-Music.git',
                            'https://github.com/nivash01/Echo.git')
              t = t.replace('cd Echo-Music', 'cd Echo')
              p.write_text(t, encoding='utf-8')

          p = Path('app/src/main/kotlin/com/music/echo/listentogether/ListenTogetherServers.kt')
          if p.exists():
              t = p.read_text(encoding='utf-8')
              t = t.replace('https://raw.githubusercontent.com/EchoMusicApp/Echo-Music/refs/heads/main/app/server.json',
                            'https://raw.githubusercontent.com/nivash01/Echo/refs/heads/main/app/server.json')
              p.write_text(t, encoding='utf-8')
          PY

          # Rename branding-specific tracked files while preserving package paths and modules.
          while IFS= read -r -d '' old; do
            new="${old//EchoMusic/Nivukx}"
            [ "$new" = "$old" ] || git mv "$old" "$new"
          done < <(git ls-files -z '*EchoMusic*')

          [ -f ECHO_BRAIN_DOCS.md ] && git mv ECHO_BRAIN_DOCS.md NIVUKX_BRAIN_DOCS.md || true
          [ -f assets/Echo-new.png ] && git mv assets/Echo-new.png assets/Nivukx.png || true
          [ -f scripts/echo_audit.py ] && git mv scripts/echo_audit.py scripts/nivukx_audit.py || true

      - name: Commit Nivukx branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
          else
            git commit -m "refactor(branding): normalize Nivukx name"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/nivukx-branding-normalize.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary branding workflow"
          git push
