name: Nivukx branding normalization

on:
  push:
    branches:
      - rename/nivukx

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize exact public branding
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          skip_dirs = {'.git', '.gradle', 'build', '.idea'}
          skip_files = {'.github/workflows/nivukx-branding-normalize.yml'}
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.mp3', '.wav',
              '.mp4', '.zip', '.jar', '.aar', '.keystore', '.jks'
          }
          replacements = {
              'Echo Music': 'Nivukx',
              'Echo Find': 'Nivukx Find',
              'Echo Brain': 'Nivukx Brain',
              'Echo Motion': 'Nivukx Motion',
              'EchoMusic (2026)': 'Nivukx (2026)',
              'echomusic Crash Report': 'Nivukx Crash Report',
          }

          changed = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if path.as_posix() in skip_files or path.suffix.lower() in binary_suffixes:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Normalized {len(changed)} files.')
          for path in changed:
              print(path)

      - name: Verify no legacy public brand phrases remain
        shell: python
        run: |
          from pathlib import Path

          skip_dirs = {'.git', '.gradle', 'build', '.idea'}
          skip_files = {'.github/workflows/nivukx-branding-normalize.yml'}
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.mp3', '.wav',
              '.mp4', '.zip', '.jar', '.aar', '.keystore', '.jks'
          }
          banned = (
              'Echo Music',
              'Echo Find',
              'Echo Brain',
              'Echo Motion',
              'EchoMusic (2026)',
              'echomusic Crash Report',
          )

          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if path.as_posix() in skip_files or path.suffix.lower() in binary_suffixes:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for value in banned:
                  if value in text:
                      failures.append(f'{path}: {value}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Nivukx public-brand verification passed.')

      - name: Commit normalized branding
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No branding changes required."
            exit 0
          fi
          git commit -m "refactor(branding): complete Nivukx textual normalization"
          git push origin HEAD:rename/nivukx
