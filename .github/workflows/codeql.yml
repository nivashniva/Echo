name: "CodeQL (No App Build)"

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1'

jobs:
  analyze-java:
    name: Analyze Java sources without building the Android app
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL for Java without build
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"
