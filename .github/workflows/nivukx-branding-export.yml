name: Nivukx branding export

on:
  push:
    branches:
      - rename/nivukx

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Normalize tracked text files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = {
              'Echo Music': 'Nivukx',
              'Echo Find': 'Nivukx Find',
              'Echo Brain': 'Nivukx Brain',
              'Echo Motion': 'Nivukx Motion',
              'EchoMusic (2026)': 'Nivukx (2026)',
              'echomusic Crash Report': 'Nivukx Crash Report',
          }
          binary = {'.png','.jpg','.jpeg','.webp','.gif','.mp3','.wav','.mp4','.zip','.jar','.aar','.keystore','.jks'}
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          changed = []
          for name in files:
              p = Path(name)
              if p.suffix.lower() in binary:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(name)
          print(f'Changed {len(changed)} files')
          for name in changed:
              print(name)
          PY
      - name: Export normalized tree
        run: |
          git diff --binary > /tmp/nivukx-branding.patch
          git diff --numstat > /tmp/nivukx-branding.numstat
          git diff --name-only > /tmp/nivukx-branding.files
          cp /tmp/nivukx-branding.patch .
          cp /tmp/nivukx-branding.numstat .
          cp /tmp/nivukx-branding.files .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-branding-export
          path: |
            nivukx-branding.patch
            nivukx-branding.numstat
            nivukx-branding.files
          if-no-files-found: error
