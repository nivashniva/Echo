name: Nivukx Universal GMS Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nivukx-universal-gms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Universal GMS Debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Universal GMS Debug
        run: ./gradlew assembleUniversalGmsDebug --stacktrace --no-daemon --build-cache

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nivukx-Universal-GMS-Debug
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.aab
          if-no-files-found: error
          retention-days: 14
