name: Build Echo-Music

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Repair Kotlin compile blockers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/music/echo/playback/MusicService.kt")
          text = path.read_text(encoding="utf-8")

          if "import java.util.concurrent.ConcurrentHashMap" not in text:
              marker = "import java.time.LocalDateTime\n"
              if marker not in text:
                  raise SystemExit("Unable to locate Java import anchor")
              text = text.replace(marker, marker + "import java.util.concurrent.ConcurrentHashMap\n", 1)

          if "import kotlinx.coroutines.cancel\n" not in text:
              marker = "import kotlinx.coroutines.CoroutineScope\n"
              if marker not in text:
                  raise SystemExit("Unable to locate coroutine import anchor")
              text = text.replace(marker, marker + "import kotlinx.coroutines.cancel\n", 1)

          old = "return currentSong.value?.song"
          new = "return currentSong.value"
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          if git diff --quiet -- app/src/main/kotlin/com/music/echo/playback/MusicService.kt; then
            echo "No source repair was necessary."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/kotlin/com/music/echo/playback/MusicService.kt
            git commit -m "Fix MusicService Kotlin compile blockers [skip ci]"
            git push origin HEAD:main
          fi

      - name: Finalize source-level repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/build.yml")
          text = path.read_text(encoding="utf-8")
          pattern = r'\n      - name: Repair Kotlin compile blockers\n.*?(?=\n      - name: Show Java version)'
          cleaned, count = re.subn(pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Unable to remove temporary source-repair step")
          path.write_text(cleaned, encoding="utf-8")
          PY

          if git diff --quiet -- .github/workflows/build.yml; then
            echo "CI bootstrap already finalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/workflows/build.yml
            git commit -m "Remove temporary CI source repair"
            git push origin HEAD:main
          fi

      - name: Show Java version
        run: java -version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify debug keystore
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        if: success()
        run: |
          echo "Generated APK files:"
          find . -type f -path "*/build/outputs/apk/*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Music-debug
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
          retention-days: 14