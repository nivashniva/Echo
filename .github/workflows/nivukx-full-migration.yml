name: Nivukx Full Code Migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: complete Nivukx code migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply deterministic Nivukx migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('.')
          tracked = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          tracked = [p for p in tracked if p]
          exts = {'.kt','.kts','.java','.proto','.xml','.gradle','.properties','.json','.yml','.yaml','.md','.txt','.pro','.py','.sh','.toml','.cfg','.conf','.ini','.html','.css','.js','.ts','.tsx','.jsx'}
          replacements = [
            ('echo.music.iad1tya','nivukx.music.nivukx'),
            ('echo/music/iad1tya','nivukx/music/nivukx'),
            ('com.music.echo','com.music.nivukx'),
            ('EchoMusic','NivukxMusic'),
            ('echo_music','nivukx'),
            ('echomusic','nivukx'),
            ('IAD1TYA','NIVUKX'),
            ('iad1tya','nivukx'),
            ('ECHO','NIVUKX'),
            ('Echo Music','Nivukx'),
            ('Echo','Nivukx'),
          ]
          protected = ['echomusic.fun']
          for rel in tracked:
            p = root / rel
            if p.suffix.lower() not in exts and p.name not in {'gradlew','gradlew.bat','settings.gradle'}: continue
            try: s = p.read_text(encoding='utf-8')
            except (UnicodeDecodeError,OSError): continue
            old = s
            for i,v in enumerate(protected): s=s.replace(v,f'__NIVUKX_PROTECTED_{i}__')
            for a,b in replacements: s=s.replace(a,b)
            for i,v in enumerate(protected): s=s.replace(f'__NIVUKX_PROTECTED_{i}__',v)
            if s != old: p.write_text(s,encoding='utf-8',newline='')
          # Rename source/package paths. Do not rename the repository itself.
          subprocess.run(['git','add','-A'],check=True)
          current = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          current = [p for p in current if p]
          pairs=[]
          for old in current:
            new=old
            for a,b in [('/echo/','/nivukx/'),('/iad1tya/','/nivukx/'),('/Echo/','/Nivukx/')]: new=new.replace(a,b)
            base=Path(new).name
            directory=str(Path(new).parent) if str(Path(new).parent)!='.' else ''
            for a,b in [('EchoMusic','NivukxMusic'),('Echo','Nivukx'),('iad1tya','nivukx'),('echo','nivukx')]: base=base.replace(a,b)
            new=str(Path(directory)/base) if directory else base
            if new!=old and not (root/new).exists(): pairs.append((old,new))
          for old,new in sorted(dict.fromkeys(pairs),key=lambda x:len(x[0]),reverse=True):
            if (root/old).exists():
              (root/new).parent.mkdir(parents=True,exist_ok=True)
              subprocess.run(['git','mv',old,new],check=True)
          subprocess.run(['git','add','-A'],check=True)
          # applicationId is deliberately not changed: it is the Android install/update identity.
          PY
      - name: Verify migration
        run: |
          set -e
          if git grep -n -E 'echo\.music\.iad1tya|echo/music/iad1tya|com\.music\.echo|IAD1TYA|iad1tya' -- ':!.github/workflows/nivukx-full-migration.yml'; then exit 1; fi
          echo 'Legacy namespace identifiers are absent.'
      - name: Compile unchanged build configuration
        run: ./gradlew :app:compileUniversalGmsDebugKotlin --stacktrace --no-daemon
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: complete Nivukx code migration'
          git push origin HEAD:main
