name: Recover DatabaseDao

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message != 'Recover DatabaseDao from known-good commit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore DatabaseDao and remove recovery workflow
        run: |
          set -euo pipefail
          git checkout 140e0df0a91f4da7cacab90b4fcd38d077969a54 -- core/src/main/kotlin/echo/music/iad1tya/db/DatabaseDao.kt
          rm -f .github/workflows/recover-dao.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/kotlin/echo/music/iad1tya/db/DatabaseDao.kt .github/workflows/recover-dao.yml
          git commit -m 'Recover DatabaseDao from known-good commit'
          git push origin main
